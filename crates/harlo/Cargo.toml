[package]
name = "harlo"
version = "0.1.0"
description = "A native desktop app for coding agents run by OpenCode, drawn with Slint."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "harlo"
path = "src/main.rs"

[dependencies]
# Harlo's state and runtime folders, for the single-instance socket.
dirs = { workspace = true }
ksni = { workspace = true, features = ["async-io", "blocking"] }
shell-words = { workspace = true }
# The microphone, for dictation.
cpal = { workspace = true }
# The event sounds Settings → Notifications picks.
rodio = { workspace = true }
resvg = { workspace = true }
harlo-core = { workspace = true }
# The pairing QR code in Settings → Phone.
qrcode = { workspace = true }
# The UI (Royalty-free 2.0 licence, see the workspace Cargo.toml): Skia draws
# the window through winit, on X11 or Wayland; the software renderer serves
# headless snapshots. The winit hook reports when the window gains or loses
# the focus; Slint is pinned exactly, so its unstable API can't shift.
slint = { workspace = true, features = ["std", "compat-1-18", "accessibility", "backend-winit-x11", "backend-winit-wayland", "renderer-skia", "renderer-software", "unstable-winit-030"] }
mimalloc = { workspace = true }
rfd = { workspace = true, features = ["xdg-portal"] }
arboard = { workspace = true, features = ["image-data", "wayland-data-control"] }
png = { workspace = true }
# Project icons kept on the server as `data:` URLs.
base64 = { workspace = true, features = ["std"] }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
alacritty_terminal = { workspace = true }
notify-rust = { workspace = true, features = ["z"] }
open = { workspace = true }
# Runs the app's background work (requests to OpenCode, git, disk) off the
# window's thread.
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros"] }
futures-util = { workspace = true, features = ["std"] }
# Answers as blocks, and code coloured by language.
pulldown-cmark = { workspace = true }
syntect = { workspace = true, features = ["default-fancy"] }
# Code points of the icons the window shows by kind, such as a tab's.
lucide-icons = { workspace = true }

[build-dependencies]
slint-build = { workspace = true, features = ["compat-1-18", "renderer-software"] }
# The icon font and its code points (ISC), written out for the UI to import.
lucide-icons = { workspace = true }

[dev-dependencies]
shell-words = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
llmfit-core = { workspace = true }
# A private OpenCode server for the tests that need one.
opencode-client = { workspace = true }
# The stress example times frames with Slint's rendering notifier, which the
# default Skia surface (wgpu) serves only with its graphics API exposed.
# Dev-only, so the app itself doesn't take the unstable API.
slint = { workspace = true, features = ["unstable-wgpu-30"] }
ttf-parser = { workspace = true }
i-slint-backend-testing = { workspace = true, features = ["renderer-software"] }
# A desktop's side of the tray, on a private bus.
zbus = { workspace = true }
# A stand-in phone for Settings → Phone.
tokio-tungstenite = { workspace = true, features = ["connect"] }
futures-util = { workspace = true, features = ["std"] }
# A stand-in remote MCP server that needs OAuth, for Settings → Extensions.
axum = { workspace = true, features = ["http1", "tokio", "json", "query"] }
reqwest = { workspace = true }

[lints]
workspace = true
