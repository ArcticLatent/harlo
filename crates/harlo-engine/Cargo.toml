[package]
name = "harlo-engine"
version.workspace = true
description = "Harlo's agent engine: the loop, tools, providers and permission rules, as a library."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
base64 = { workspace = true, features = ["std"] }
globset = { workspace = true }
gray_matter = { workspace = true }
shell-words = { workspace = true }
tree-sitter = { workspace = true }
tree-sitter-bash = { workspace = true }
tree-sitter-rust = { workspace = true }
tree-sitter-python = { workspace = true }
tree-sitter-javascript = { workspace = true }
tree-sitter-typescript = { workspace = true }
tree-sitter-go = { workspace = true }
tree-sitter-swift = { workspace = true }
tree-sitter-c = { workspace = true }
tree-sitter-cpp = { workspace = true }
tree-sitter-java = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true, features = ["std", "unicode", "perf"] }
rquickjs = { workspace = true }
htmd = { workspace = true }
markup5ever_rcdom = { workspace = true }
futures-util = { workspace = true, features = ["alloc"] }
getrandom = { workspace = true, features = ["std"] }
httpdate = { workspace = true }
jsonc-parser = { workspace = true, features = ["serde"] }
libc = { workspace = true }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
similar = { workspace = true, features = ["std", "text"] }
sse-stream = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "process", "fs", "io-util", "rt", "macros"] }
tokio-util = { workspace = true }
tracing = { workspace = true, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
