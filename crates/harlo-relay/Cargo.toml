[package]
name = "harlo-relay"
description = "Lets phones reach harlo from anywhere: serves harlo's phone app and forwards its end-to-end encrypted frames"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "harlo-relay"
path = "src/main.rs"

[dependencies]
axum = { workspace = true, features = ["http1", "tokio", "ws", "query"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net"] }
futures-util.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
sha2.workspace = true
base64.workspace = true
# The iOS app's notifications, sent with the app's APNs key (POST /push).
harlo-apns.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
# A stand-in for Apple's push service (HTTP/2) in the tests.
axum = { workspace = true, features = ["http1", "http2", "tokio", "ws", "query"] }

[lints]
workspace = true
