[package]
name = "harlo-harness"
description = "The agents harlo drives (Harlo and Claude Code), their protocols as one event vocabulary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
chrono = { workspace = true, features = ["clock", "std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing.workspace = true
base64.workspace = true
libc.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "test-util"] }

[lints]
workspace = true
