<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#151312">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>harlo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header id="bar">
    <button id="back" class="icon" aria-label="Sessions" hidden>‹</button>
    <div id="heading"><div id="title">harlo</div><div id="subtitle"></div></div>
    <span id="dot" class="dot" title="Connection"></span>
  </header>
  <main id="view"></main>
  <footer id="composer" hidden>
    <div id="request" hidden></div>
    <div class="row">
      <textarea id="input" rows="1" placeholder="Message…" enterkeyhint="send"></textarea>
      <button id="stop" class="round danger" aria-label="Stop" hidden>■</button>
      <button id="send" class="round primary" aria-label="Send">↑</button>
    </div>
  </footer>
</div>
<script src="nacl.js"></script>
<script src="app.js"></script>
</body>
</html>
