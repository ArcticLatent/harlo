[package]
name = "harlo-app"
description = "harlo's desktop app: the Qt window, its panels, and the phone server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "harlo"
path = "src/main.rs"

[dependencies]
harlo-core.workspace = true
harlo-harness.workspace = true
# The code view: text laid out and drawn in Rust.
harlo-code.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib = { workspace = true, features = ["qt_full"] }
anyhow.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["ansi", "env-filter", "fmt", "smallvec", "std", "tracing-log"] }
# Phone access: its web app and encrypted WebSocket, and the pairing QR code.
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
qrcode = { workspace = true, features = ["svg"] }
base64.workspace = true
# Mermaid diagrams in the chat, drawn without a browser (diagrams.rs).
merman = { workspace = true, features = ["png", "native-fonts"] }
futures-util.workspace = true
# To a harlo relay (wss); its relay ids.
harlo-relay.workspace = true
# The iOS app's notifications, handed to harlo's relay.
harlo-apns.workspace = true
tokio-tungstenite = { workspace = true, features = ["rustls-tls-webpki-roots"] }
chrono = { workspace = true, features = ["clock", "std"] }
# Tailscale Funnel dies with harlo (PR_SET_PDEATHSIG).
libc.workspace = true

[build-dependencies]
cxx-qt-build = { workspace = true, features = ["link_qt_object_files"] }

[dev-dependencies]
ttf-parser.workspace = true
crypto_box = { workspace = true, features = ["std"] }

# cxx-qt's generated bridge code calls cxx, which no source file names.
[package.metadata.cargo-machete]
ignored = ["cxx"]

[lints]
workspace = true
