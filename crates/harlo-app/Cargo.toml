[package]
name = "harlo-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "harlo"
path = "src/main.rs"

[dependencies]
harlo-core.workspace = true
harlo-harness.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Phone access: its web app and encrypted WebSocket, and the pairing QR code.
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64 = "0.22"
futures-util = "0.3"
# To a harlo relay (wss); its relay ids.
harlo-relay.workspace = true
# The iOS app's notifications, handed to harlo's relay.
harlo-apns.workspace = true
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# Tailscale Funnel dies with harlo (PR_SET_PDEATHSIG).
libc = "0.2"

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
crypto_box = { version = "0.9", features = ["std"] }
