[package]
name = "harlo-core"
description = "harlo's logic without Qt: transcripts, Markdown, live sessions, the sidebar and storage"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["dictation"]
# Dictation (whisper.cpp). harlo-engines, the helper harlo puts on other
# machines, is built without it (--no-default-features).
dictation = ["dep:whisper-rs"]

[dependencies]
harlo-worktree.workspace = true
harlo-harness.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tracing.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
pulldown-cmark = { workspace = true, features = ["html"] }
syntect = { workspace = true, features = ["default-fancy"] }
# More languages than syntect bundles (TypeScript, QML, TOML, Kotlin, Dockerfile…).
two-face = { workspace = true, features = ["syntect-fancy"] }
rusqlite = { workspace = true, features = ["bundled"] }
ignore.workspace = true
nucleo-matcher.workspace = true
chrono = { workspace = true, features = ["clock", "std"] }
alacritty_terminal.workspace = true
# Dictation: whisper.cpp built in (CPU), and model downloads.
whisper-rs = { workspace = true, features = ["tracing_backend"], optional = true }
ureq = { workspace = true, features = ["platform-verifier"] }
# harlo's own updates: the download's SHA-256, checked against the release's
# signed manifest.
sha2.workspace = true
harlo-update-signing.workspace = true
# The wiki's reading tools (search, read, linked wikis), native.
harlo-okf.workspace = true
# Phone pairing: NaCl box (X25519 + XSalsa20-Poly1305), as the phone's tweetnacl.
crypto_box = { workspace = true, features = ["std"] }
base64.workspace = true
libc.workspace = true

[dev-dependencies]
# Tests read fixture wikis only, never the user's linked ones.
# Signs stand-in release manifests in the update tests.
ed25519-dalek = { workspace = true, features = ["std"] }

[lints]
workspace = true
