[package]
name = "harlo-core"
version = "0.1.0"
description = "Harlo's domain model: themes, sessions and the state the app shows. No UI code."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
opencode-client = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "macros", "io-util"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
# SQLite is built in, so the app needs no system library.
rusqlite = { workspace = true, features = ["bundled"] }
dirs = { workspace = true }
jsonc-parser = { workspace = true, features = ["cst"] }
jiff = { workspace = true }
similar = { workspace = true, features = ["std", "text"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
