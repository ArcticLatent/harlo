[package]
name = "harlo-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
harlo-harness.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tracing.workspace = true
tokio.workspace = true
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
rusqlite = { version = "0.40", features = ["bundled"] }
ignore = "0.4"
nucleo-matcher = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
alacritty_terminal = "0.26.0"
yaml-rust = "0.4"
# Dictation: whisper.cpp built in (CPU), and model downloads.
whisper-rs = { version = "0.16", features = ["tracing_backend"] }
ureq = { version = "3", features = ["platform-verifier"] }
# harlo's own updates: the download's SHA-256, checked against the release's.
sha2 = "0.10"
# Phone pairing: NaCl box (X25519 + XSalsa20-Poly1305), as the phone's tweetnacl.
crypto_box = { version = "0.9", features = ["std"] }
base64 = "0.22"
