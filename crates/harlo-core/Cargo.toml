[package]
name = "harlo-core"
version = "0.1.0"
description = "Harlo's domain model: themes, sessions and the state the app shows. No UI code."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The hosts in ~/.ssh/config, offered in Settings → Server.
ssh2-config = { workspace = true }
harlo-client = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time", "process", "macros", "io-util", "fs", "net"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
# SQLite is built in, so the app needs no system library.
rusqlite = { workspace = true, features = ["bundled"] }
dirs = { workspace = true }
jsonc-parser = { workspace = true, features = ["cst", "serde_json"] }
jiff = { workspace = true }
similar = { workspace = true, features = ["std", "text"] }
# Forgejo's API, over the system's TLS and certificates (company CAs included).
reqwest = { workspace = true, features = ["native-tls", "json"] }
# Downloads are checked against their published SHA-256.
sha2 = { workspace = true }
hex = { workspace = true }
# Local models: what fits this computer (llmfit), and installing engines
# from their release archives.
llmfit-core = { workspace = true }
# The system's font families, for Settings → Appearance.
fontdb = { workspace = true }
which = { workspace = true }
# What follows `ssh` for another computer, split as a shell would.
shell-words = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
ruzstd = { workspace = true }
# The phone: a WebSocket server for it, the relay's WebSocket, and the
# sealed frames between them.
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
crypto_box = { workspace = true, features = ["std", "getrandom", "salsa20"] }
tokio-tungstenite = { workspace = true, features = ["connect", "native-tls"] }
base64 = { workspace = true, features = ["std"] }
# The addresses phones on this network reach Harlo at.
if-addrs = { workspace = true }
# Answers as HTML for the phone.
pulldown-cmark = { workspace = true, features = ["html"] }
# Dictation: whisper.cpp, built in, behind one API for speech models.
transcribe-rs = { workspace = true, features = ["whisper-cpp"] }

[lints]
workspace = true

[dev-dependencies]
# A stand-in relay for the phone tests.
axum = { workspace = true, features = ["http1", "tokio", "ws", "query", "json"] }
crypto_box = { workspace = true, features = ["std", "getrandom", "salsa20"] }
tokio-tungstenite = { workspace = true, features = ["connect"] }
base64 = { workspace = true, features = ["std"] }
shell-words = { workspace = true }
ruzstd = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
llmfit-core = { workspace = true }
tempfile = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
