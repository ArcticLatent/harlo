[package]
name = "opencode-client"
version = "0.1.0"
description = "Client for OpenCode 2's server API: sessions, events, approvals and diffs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
futures-util = { workspace = true }
getrandom = { workspace = true, features = ["std"] }
reqwest = { workspace = true, features = ["json", "stream", "query"] }
sse-stream = { workspace = true }
tokio = { workspace = true, features = ["time", "sync", "rt"] }
tracing = { workspace = true, features = ["std"] }
regress = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "time", "fs"] }
