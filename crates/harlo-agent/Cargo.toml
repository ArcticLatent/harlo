[package]
name = "harlo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "harlo's own coding agent"

[[bin]]
name = "harlo-agent"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
