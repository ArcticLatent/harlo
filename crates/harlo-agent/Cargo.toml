[package]
name = "harlo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "harlo's own coding agent"

[[bin]]
name = "harlo-agent"
path = "src/main.rs"

[dependencies]
harlo-wiki = { path = "../harlo-wiki" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "fs", "io-std"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json", "stream"] }
futures-util = "0.3"
httpdate = "1"
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
htmd = "0.5.6"
markup5ever_rcdom = "=0.38.0"
