[package]
name = "harlo-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "harlo's own coding agent"

[[bin]]
name = "harlo-agent"
path = "src/main.rs"

[dependencies]
harlo-okf.workspace = true
anyhow.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["preserve_order"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal", "net", "fs", "io-std"] }
tokio-util.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-tls", "json", "stream"] }
futures-util.workspace = true
httpdate.workspace = true
sha2.workspace = true
base64.workspace = true
getrandom.workspace = true
libc.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp"] }
htmd.workspace = true
markup5ever_rcdom.workspace = true

[lints]
workspace = true
