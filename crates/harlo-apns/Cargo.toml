[package]
name = "harlo-apns"
description = "Sends harlo's notifications to the iOS app through Apple's push service, directly or through a harlo relay"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
base64 = "0.22"
# APNs: its ES256 token (ring), HTTP/2 (reqwest on rustls).
ring = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "json"] }

[dev-dependencies]
tokio = { workspace = true }
