[package]
name = "harlo-apns"
description = "Sends harlo's notifications to the iOS app through Apple's push service, directly or through a harlo relay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
serde_json = { workspace = true, features = ["preserve_order"] }
base64.workspace = true
# APNs: its ES256 token (ring), HTTP/2 (reqwest on rustls).
ring.workspace = true
reqwest = { workspace = true, features = ["http2", "rustls-tls", "json"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }

[lints]
workspace = true
