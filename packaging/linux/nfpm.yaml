# Harlo's .deb, .rpm and Arch packages, from packaging/linux/bundle.sh's
# dist/opt/harlo:
#
#   VERSION=$(cat dist/version) nfpm package -f packaging/linux/nfpm.yaml -p deb -t dist/
#   (and -p rpm, -p archlinux)
#
# Installs to /opt/harlo, with /usr/bin/harlo, the menu entry and icons.
# Depends only on what every desktop has, and git.
name: harlo
arch: amd64
platform: linux
version: ${VERSION}
release: 1
section: devel
priority: optional
maintainer: ArcticLatent <hello@harlo.run>
vendor: harlo
homepage: https://harlo.run
license: MIT
description: |-
  Desktop app for coding agents.
  Harlo runs your agents on its own server, in the background on your
  computer or on your other machines over SSH, with a native chat, changes
  and diffs, worktrees, a terminal, and an iPhone app to follow and answer
  them.

contents:
  - src: dist/opt/harlo
    dst: /opt/harlo
    type: tree
  - src: /opt/harlo/bin/harlo
    dst: /usr/bin/harlo
    type: symlink
  - src: /opt/harlo/bin/harlo-server
    dst: /usr/bin/harlo-server
    type: symlink
  - src: packaging/harlo.desktop
    dst: /usr/share/applications/harlo.desktop
  - src: packaging/harlo.svg
    dst: /usr/share/icons/hicolor/scalable/apps/harlo.svg
  - src: dist/opt/harlo/share/icons/hicolor/256x256/apps/harlo.png
    dst: /usr/share/icons/hicolor/256x256/apps/harlo.png
  - src: LICENSE
    dst: /usr/share/licenses/harlo/LICENSE
  # How Harlo was installed (its updates use the same kind of package).
  - src: packaging/linux/kind/deb
    dst: /opt/harlo/install-kind
    packager: deb
  - src: packaging/linux/kind/rpm
    dst: /opt/harlo/install-kind
    packager: rpm
  - src: packaging/linux/kind/arch
    dst: /opt/harlo/install-kind
    packager: archlinux

overrides:
  # What the programs link, and what the window loads when it opens (X11
  # or Wayland, OpenGL, the keyboard): checked by
  # packaging/linux/test-install.sh on clean images.
  deb:
    depends:
      - libc6 (>= 2.35)
      - libstdc++6
      - libgcc-s1
      - libfontconfig1
      - libfreetype6
      # (Not the bare virtual name: Ubuntu 24.04 satisfies it with an OSS
      # shim that lacks ALSA's functions.)
      - libasound2t64 | libasound2
      - libxkbcommon0
      - libxkbcommon-x11-0
      - libx11-6
      - libx11-xcb1
      - libxcursor1
      - libxrandr2
      - libxi6
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libegl1
      - libgl1
      - git
    recommends:
      - openssh-client
  # (By library, not package name: Fedora's and openSUSE's names differ.)
  rpm:
    depends:
      - libc.so.6(GLIBC_2.35)(64bit)
      - libstdc++.so.6()(64bit)
      - libgcc_s.so.1()(64bit)
      - libfontconfig.so.1()(64bit)
      - libfreetype.so.6()(64bit)
      - libasound.so.2()(64bit)
      - libxkbcommon.so.0()(64bit)
      - libxkbcommon-x11.so.0()(64bit)
      - libX11.so.6()(64bit)
      - libX11-xcb.so.1()(64bit)
      - libXcursor.so.1()(64bit)
      - libXrandr.so.2()(64bit)
      - libXi.so.6()(64bit)
      - libwayland-client.so.0()(64bit)
      - libwayland-cursor.so.0()(64bit)
      - libwayland-egl.so.1()(64bit)
      - libEGL.so.1()(64bit)
      - libGL.so.1()(64bit)
      - git
    recommends:
      - /usr/bin/ssh
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - fontconfig
      - freetype2
      - alsa-lib
      - libxkbcommon
      - libxkbcommon-x11
      - libx11
      - libxcursor
      - libxrandr
      - libxi
      - wayland
      - libglvnd
      - git

rpm:
  summary: Desktop app for coding agents
  group: Development/Tools
deb:
  fields:
    Bugs: https://github.com/ArcticLatent/harlo/issues
archlinux:
  packager: ArcticLatent <hello@harlo.run>
