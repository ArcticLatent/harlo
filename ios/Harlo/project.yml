# The iOS app's Xcode project, for XcodeGen (`xcodegen generate` here makes
# Harlo.xcodeproj; CI does it, see .github/workflows/ios.yml).
name: Harlo
options:
  bundleIdPrefix: com.arcticlatent
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  HarloKit:
    path: ../HarloKit
targets:
  Harlo:
    type: application
    platform: iOS
    sources:
      - path: Harlo
      # The Live Activity's attributes (the widget extension has them too).
      - path: Shared
      # JetBrains Mono, as on the desktop (OFL; the desktop's copies).
      - path: ../../crates/harlo-app/fonts/JetBrainsMono-Regular.ttf
        buildPhase: resources
      - path: ../../crates/harlo-app/fonts/JetBrainsMono-Medium.ttf
        buildPhase: resources
      - path: ../../crates/harlo-app/fonts/JetBrainsMono-SemiBold.ttf
        buildPhase: resources
      - path: ../../crates/harlo-app/fonts/JetBrainsMono-Bold.ttf
        buildPhase: resources
    dependencies:
      - package: HarloKit
        product: HarloKit
      # Opens harlo's notifications (sealed for this phone).
      - target: HarloNotifications
      # The Live Activity on the lock screen and in the Dynamic Island.
      - target: HarloWidgets
    scheme: {}
    # Push notifications; the Keychain group the notification extension
    # reads too (the app's own, where its keys have always been).
    entitlements:
      path: Harlo/Harlo.entitlements
      properties:
        aps-environment: production
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.arcticlatent.harlo
    info:
      path: Harlo/Info.plist
      properties:
        CFBundleDisplayName: Harlo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # harlo's navy, as the logo's splash that follows it.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSupportsIndirectInputEvents: true
        # A session at work on the lock screen (harlo sends the updates).
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        # harlo://session?key=… (a Live Activity tapped).
        CFBundleURLTypes:
          - CFBundleURLName: com.arcticlatent.harlo
            CFBundleURLSchemes: [harlo]
        # Export compliance, so TestFlight doesn't ask on every build: the
        # app's end-to-end encryption (NaCl box: X25519, XSalsa20-Poly1305)
        # is standard, mass-market encryption (EAR 740.17(b)(1); Canada's
        # export list exempts it too), which Apple's questions count as
        # exempt. Selling in France needs its own declaration.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: harlo uses the camera to scan the pairing QR code shown by harlo on your computer, and to take photos you send to an agent.
        NSPhotoLibraryUsageDescription: harlo sends the photos you pick to an agent.
        NSMicrophoneUsageDescription: harlo listens while you dictate a message (tap the mic), and only then.
        NSSpeechRecognitionUsageDescription: harlo turns what you dictate into text, on the iPhone when it can. Nothing is kept.
        UIAppFonts:
          - JetBrainsMono-Regular.ttf
          - JetBrainsMono-Medium.ttf
          - JetBrainsMono-SemiBold.ttf
          - JetBrainsMono-Bold.ttf
        NSLocalNetworkUsageDescription: harlo connects to harlo on your computer over your network.
        # harlo on your computer serves plain WebSockets on its own
        # addresses; everything on them is end-to-end encrypted (NaCl box).
        # Local networking alone isn't enough: Tailscale's 100.64.0.0/10
        # addresses don't count as local, so iOS refused them. (iOS ignores
        # NSAllowsArbitraryLoads while NSAllowsLocalNetworking is set, so
        # it's this one alone. App Review: the app connects to the user's
        # own computer at addresses it announces, end-to-end encrypted.)
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcticlatent.harlo
        PRODUCT_NAME: Harlo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: true

  # Opens harlo's notifications before they show: what they say comes
  # sealed for this phone (Apple carries a placeholder), opened with the
  # app's keys from the shared Keychain group.
  HarloNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: HarloNotifications
    dependencies:
      - package: HarloKit
        product: HarloKit
    entitlements:
      path: HarloNotifications/HarloNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.arcticlatent.harlo
    info:
      path: HarloNotifications/Info.plist
      properties:
        CFBundleDisplayName: Harlo notifications
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The Keychain group's team (see NotificationService).
        HarloTeam: $(DEVELOPMENT_TEAM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcticlatent.harlo.notifications
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic

  # The Live Activity (a session at work) on the lock screen and in the
  # Dynamic Island. harlo's updates say what it's doing sealed for this
  # phone; it opens them with the app's keys from the shared Keychain group.
  HarloWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: HarloWidgets
      - path: Shared
    dependencies:
      - package: HarloKit
        product: HarloKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: HarloWidgets/HarloWidgets.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.arcticlatent.harlo
    info:
      path: HarloWidgets/Info.plist
      properties:
        CFBundleDisplayName: Harlo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The Keychain group's team (see Live.keychainGroup).
        HarloTeam: $(DEVELOPMENT_TEAM)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.arcticlatent.harlo.widgets
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
