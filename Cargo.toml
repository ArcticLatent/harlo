[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# Harlo's version: packaging/release.sh sets it from CHANGELOG.md.
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/ArcticLatent/harlo"
publish = false

[workspace.dependencies]
# The signature on Harlo's update manifest, and the release tool that makes it.
harlo-update-signing = { path = "crates/harlo-update-signing" }
ed25519-dalek = { version = "2.2.0", default-features = false }
# The relay's notifications to the iOS app (crates/harlo-relay).
harlo-apns = { path = "crates/harlo-apns" }
# APNs' ES256 token, in harlo-apns.
ring = "0.17.14"
frizbee = { version = "0.13.0", default-features = false }
regex = { version = "1.13.2", default-features = false }
ignore = { version = "0.4.35", default-features = false }
globset = { version = "0.4.22", default-features = false }
# Our crates.
harlo-client = { path = "crates/harlo-client" }
harlo-core = { path = "crates/harlo-core" }
harlo-engine = { path = "crates/harlo-engine" }

# The UI toolkit for crates/harlo: Slint, under its Royalty-free 2.0
# licence (GPL-3.0-only OR LicenseRef-Slint-Royalty-free-2.0 OR
# LicenseRef-Slint-Software-3.0). Not MIT/Apache: the user chose it on
# 2026-11-22; the app shows `AboutSlint` in its About. Pinned exactly, as the
# testing backend must match.
slint = { version = "=1.19.0", default-features = false }
slint-build = { version = "=1.19.0", default-features = false }
i-slint-backend-testing = { version = "=1.19.0", default-features = false }

# OpenCode client.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1.0.228", default-features = false }
serde_json = { version = "1.0.150", default-features = false }
tokio = { version = "1.50.0", default-features = false }
futures-util = { version = "0.3.31", default-features = false }
sse-stream = { version = "0.3.0", default-features = false }
tokio-tungstenite = { version = "0.30.0", default-features = false }
regress = { version = "0.12.0", default-features = false }
getrandom = { version = "0.4.3", default-features = false }
httpdate = "1.0.3"
base64 = { version = "0.23.1", default-features = false }
mime_guess = { version = "2.0.5", default-features = false }
# Reads the front matter of OpenCode's command files (MIT); YAML, as OpenCode writes it.
gray_matter = { version = "0.3.2", default-features = false, features = ["yaml"] }
# Checks that the bundled file-icon font has every glyph the icon table uses (MIT/Apache).
ttf-parser = "0.25.1"

# UI.
lucide-icons = { version = "1.77.0", default-features = false }
mimalloc = { version = "0.1.52", default-features = false }
# File dialog for attachments (MIT); the XDG portal on Linux, so no GTK.
rfd = { version = "0.18.0", default-features = false }
# Pasted images from the clipboard (MIT/Apache); Wayland data-control first, then X11.
arboard = { version = "3.7.0", default-features = false }
# Encodes pasted images as PNG (MIT/Apache).
png = { version = "0.18.1", default-features = false }
# Decodes pictures opened in the editor tab (MIT/Apache); the version Slint
# already builds, so it costs no extra compile.
image = { version = "=0.25.10", default-features = false }
# The terminals' screens and local PTYs (Apache-2.0); drawn by Harlo's own view.
alacritty_terminal = { version = "=0.26.0", default-features = false }
# Desktop notifications when a session needs the user (MIT/Apache); D-Bus in pure Rust.
notify-rust = { version = "4.19.0", default-features = false }
# Splits answers into blocks (paragraphs, headings, code) for the timeline
# (MIT); the version Slint itself parses Markdown with.
pulldown-cmark = { version = "0.13.6", default-features = false }
# Colours code blocks (MIT); pure-Rust regexes, Sublime syntaxes and themes.
syntect = { version = "5.3.0", default-features = false }
# The phone: its WebSocket and page (MIT), and NaCl's box, as the phone app
# seals its frames (MIT/Apache).
axum = { version = "0.8.9", default-features = false }
crypto_box = { version = "0.9.1", default-features = false }
# This computer's network addresses, for phones on the same network (MIT).
if-addrs = { version = "0.15.0", default-features = false }
# The pairing QR code (MIT/Apache).
qrcode = { version = "0.14.1", default-features = false }
# Opens a link a question points to in the user's browser (MIT).
open = { version = "5.4.5", default-features = false }
# Terminals the server runs for its clients (MIT).
portable-pty = { version = "0.9.0", default-features = false }
# Automations' cron schedules, in a time zone (MIT).
croner = { version = "5.0.0", default-features = false, features = ["std", "jiff"] }
# Code Mode: runs an agent's JavaScript against Harlo's tools (MIT).
htmd = "0.5.6"
markup5ever_rcdom = "=0.38.0"
rquickjs = { version = "0.14.0", default-features = false, features = ["std"] }

# Code generation (dev tool only).
typify = { version = "0.10.1", default-features = false }
schemars = { version = "0.8.22", default-features = false }
syn = { version = "3.0.10", default-features = false }
prettyplease = { version = "0.3.0", default-features = false }

# Shared.
# Word-level highlights inside changed diff lines (Apache-2.0).
similar = { version = "3.2.1", default-features = false }
# Reads the reset times of Claude plan limits, and the local time for quiet
# hours from the system's time zone (MIT/Unlicense).
jiff = { version = "1.0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
rusqlite = { version = "0.43.0", default-features = false }
dirs = { version = "7.0.0", default-features = false }
# The tray icon over D-Bus, on the zbus 5 that Slint already runs on async-io
# (Unlicense: allowed for this crate by the user's choice, 2026-11-22).
ksni = { version = "0.3.7", default-features = false }
# Talks to the tray icon in tests, as a desktop would (MIT); Slint builds it already.
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
# Draws Harlo's logo for the tray icon; Slint builds it already (MIT/Apache).
resvg = { version = "0.49.0", default-features = false }
# Edits OpenCode's config file and keeps its comments (MIT).
jsonc-parser = { version = "0.34.0", default-features = false }
# Encoding names, such as an MCP server's, into request paths (MIT/Apache).
percent-encoding = { version = "2.3.2", default-features = false, features = ["std"] }
# Serving Harlo's own tools to OpenCode's agents as an MCP server: the official SDK (Apache-2.0).
rmcp = { version = "3.11.0", default-features = false, features = ["server"] }
# Splitting a typed command line, quotes included, as a shell would (MIT/Apache).
shell-words = { version = "1.1.1", default-features = false, features = ["std"] }
tempfile = { version = "3.27.0", default-features = false }
sha2 = { version = "0.11.1", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["alloc"] }
async-trait = "0.1.92"
llmfit-core = { version = "1.1.20", default-features = false }
# The system's font families for Settings → Appearance (MIT); the version Slint already uses.
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs", "memmap", "fontconfig"] }
which = { version = "8.0.6", default-features = false, features = ["real-sys"] }
flate2 = { version = "1.1.11", default-features = false, features = ["rust_backend"] }
tar = { version = "0.4.46", default-features = false }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
transcribe-rs = { version = "0.3.12", default-features = false }
cpal = { version = "0.18.2", default-features = false }
# Reading the hosts named in ~/.ssh/config, Include lines and all.
ssh2-config = { version = "0.9.0", default-features = false }
# Event sounds: MP3 decoding (Symphonia) and playback through cpal.
rodio = { version = "0.23.0", default-features = false, features = ["playback", "mp3"] }
anyhow = { version = "1.0.100", default-features = false }
# Cancelling a turn and everything it started (MIT).
tokio-util = { version = "0.7.20", default-features = false }
# Ending a command's whole process group (MIT/Apache).
libc = { version = "0.2.191", default-features = false }
tracing = { version = "0.1.41", default-features = false }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
as_pointer_underscore = "warn"
assertions_on_result_states = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
disallowed_script_idents = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
fn_to_numeric_cast_any = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
renamed_function_params = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"
too_long_first_doc_paragraph = "warn"
# May cause issues with structured logging otherwise.
literal_string_with_formatting_args = "allow"
# Private workspace crates are never published, so crates.io metadata adds nothing.
cargo_common_metadata = "allow"
# Transitive dependency version splits (Slint, wgpu, reqwest) are outside our control.
multiple_crate_versions = "allow"

# Debug builds optimise the libraries (Slint, its text shaping and renderer,
# the diff and SQLite code) and leave Harlo's own crates quick to rebuild and
# debug. Unoptimised, laying out the window takes several times longer.
[profile.dev.package."*"]
opt-level = 2

# The programs people install: smaller, without debug symbols.
[profile.release]
lto = "thin"
strip = true
