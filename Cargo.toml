[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.1"
edition = "2024"
license = "MIT"

[workspace.dependencies]
harlo-core = { path = "crates/harlo-core" }
harlo-harness = { path = "crates/harlo-harness" }
harlo-code = { path = "crates/harlo-code" }
harlo-relay = { path = "crates/harlo-relay" }
harlo-apns = { path = "crates/harlo-apns" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

# Checksums of engine downloads (gigabytes) in a dev build: seconds, not minutes.
[profile.dev.package.sha2]
opt-level = 3

# The code view draws every frame in Rust: optimized even in a dev build.
[profile.dev.package.harlo-code]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3
[profile.dev.package.ttf-parser]
opt-level = 3
[profile.dev.package.zeno]
opt-level = 3
[profile.dev.package.syntect]
opt-level = 3
[profile.dev.package.fancy-regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3

# harlo-agent as shipped: one optimized unit (smaller, less memory per session).
[profile.agent]
inherits = "release"
lto = "fat"
codegen-units = 1
