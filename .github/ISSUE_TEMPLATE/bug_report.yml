name: Bug report
description: Something in Harlo (desktop, its server, iPhone app or relay) doesn't work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Please search the [open issues](https://github.com/ArcticLatent/harlo/issues) first; if it's already there, add a 👍 or your details to it.

        **Security problems** (anything about the encryption, pairing or the relay): please don't open an issue. Email hello@harlo.run instead, see [SECURITY.md](https://github.com/ArcticLatent/harlo/blob/main/SECURITY.md).
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Desktop app
        - Sessions and agents (Harlo's server)
        - iPhone app
        - Both (desktop and iPhone)
        - The relay
        - Install / packages / updates
        - Website
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Started a session in a project with two repositories
        2. Asked it to edit both, then undid the turn
        3. Only one repository was put back
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider and model
      description: If it's about a session, which provider and model it used.
      placeholder: OpenRouter, anthropic/claude-sonnet-4.6
  - type: input
    id: version
    attributes:
      label: Harlo version
      description: "`harlo --version`, or Settings → About. On the iPhone: Settings → Version."
      placeholder: harlo 2.0.0
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, desktop (KDE, GNOME…), Wayland or X11, and how you installed Harlo. For the iPhone app, the iOS version.
      placeholder: Fedora 42, KDE Plasma 6.4, Wayland, .rpm
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The end of the server's log, `~/.local/state/harlo/server.log`, and what `harlo` prints when started from a terminal.
        Check it for anything private before you paste it.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Screenshots or anything else
      description: Drag images here.
