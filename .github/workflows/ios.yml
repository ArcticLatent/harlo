# The iOS app (ios/): HarloKit's tests, then an archive signed in the cloud
# with the App Store Connect API key and uploaded to TestFlight; and, when
# asked for (run by hand with screenshots on), screenshots of every screen
# from the iOS simulator (the app's `-tour` mode, sample content, dark and
# light) as the `screenshots` artifact.
#
# Secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8's
# text). The key needs the Admin role, so Xcode can make the signing
# certificate and profile itself.
name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  # By hand (`gh workflow run ios.yml -f screenshots=true`): the screenshots
  # only run this way, to save Mac minutes (the repo is private: macOS
  # minutes count against the plan's allowance).
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Take the screenshots too"
        type: boolean
        default: false
      testflight:
        description: "Build and upload to TestFlight"
        type: boolean
        default: true
      store:
        description: "Screenshots on a Pro Max (the App Store's 6.9-inch size)"
        type: boolean
        default: false

concurrency:
  # (By event: a screenshots run by hand never cancels a push's build.)
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  testflight:
    if: github.event_name == 'push' || inputs.testflight
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v6

      - name: Xcode (the newest installed)
        run: |
          ls -d /Applications/Xcode*.app
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"
          xcodebuild -version
          echo "::notice::$(xcodebuild -version | tr '\n' ' ')"

      - name: HarloKit tests
        run: |
          set -o pipefail
          swift test --package-path ios/HarloKit 2>&1 | tee "$RUNNER_TEMP/kit.log" | grep -E "error:|Executed|passed|failed" || true
          # Errors as annotations (readable without the logs).
          if grep -q "error:" "$RUNNER_TEMP/kit.log"; then grep "error:" "$RUNNER_TEMP/kit.log" | head -30 | sed 's/^/::error::/'; exit 1; fi

      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios/Harlo && xcodegen generate

      - name: API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          # The ids without stray spaces or newlines (easily pasted in, and
          # then xcodebuild's sign-in fails with "Cannot verify client's JWT headers").
          kid=$(printf '%s' "$ASC_KEY_ID" | tr -d '[:space:]')
          iss=$(printf '%s' "$ASC_ISSUER_ID" | tr -d '[:space:]')
          [ "$kid" = "$ASC_KEY_ID" ] || echo "::warning::The ASC_KEY_ID secret has spaces or a newline in it (ignored)"
          [ "$iss" = "$ASC_ISSUER_ID" ] || echo "::warning::The ASC_ISSUER_ID secret has spaces or a newline in it (ignored)"
          echo "KEY_ID=$kid" >> "$GITHUB_ENV"
          echo "ISSUER_ID=$iss" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" | sed 's/\r$//' > "$RUNNER_TEMP/keys/AuthKey_$kid.p8"

      - name: Check the API key
        run: |
          # Says what's wrong with the key (never its value) before the build.
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || python3 -m pip install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, re, sys, time, json, urllib.request, urllib.error
          import jwt
          kid, iss = os.environ["KEY_ID"], os.environ["ISSUER_ID"]
          path = os.path.join(os.environ["RUNNER_TEMP"], "keys", f"AuthKey_{kid}.p8")
          text = open(path).read()
          problems = []
          if not re.fullmatch(r"[A-Z0-9]{10}", kid): problems.append(f"ASC_KEY_ID should be 10 letters/digits (it has {len(kid)} characters)")
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", iss): problems.append(f"ASC_ISSUER_ID should be a UUID like 69a6de7e-... (it has {len(iss)} characters)")
          if "BEGIN PRIVATE KEY" not in text or "END PRIVATE KEY" not in text: problems.append(f"ASC_KEY_P8 should be the whole .p8 file, BEGIN/END lines included ({len(text.splitlines())} lines)")
          for p in problems: print(f"::error::{p}")
          try:
              token = jwt.encode({"iss": iss, "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"}, text, algorithm="ES256", headers={"kid": kid})
          except Exception as e:
              print(f"::error::The .p8 key doesn't read as a private key: {type(e).__name__}"); sys.exit(1)
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?filter[bundleId]=com.arcticlatent.harlo", headers={"Authorization": f"Bearer {token}"})
          try:
              apps = json.load(urllib.request.urlopen(req))["data"]
              print(f"App Store Connect accepts the key; apps with this bundle id: {len(apps)}")
              if not apps: print("::error::The key works, but there's no app with bundle id com.arcticlatent.harlo in App Store Connect")
          except urllib.error.HTTPError as e:
              body = e.read().decode(errors="replace")
              detail = "; ".join(f"{x.get('title')}: {x.get('detail')}" for x in json.loads(body).get("errors", [])) if body.startswith("{") else body[:200]
              print(f"::error::App Store Connect refused the key (HTTP {e.code}): {detail}")
              if e.code == 401: print("::error::Check: a Team key (not Individual), its Key ID in ASC_KEY_ID, the Issuer ID above the Team keys list in ASC_ISSUER_ID, the key not revoked")
              sys.exit(1)
          sys.exit(1 if problems else 0)
          PY

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/Harlo/Harlo.xcodeproj -scheme Harlo -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Harlo.xcarchive" \
            -skipPackagePluginValidation \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|\*\* ARCHIVE" || status=$?
          if ! grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Sign
        run: |
          set -o pipefail
          # The archive is unsigned, so it has no entitlements for the cloud
          # signing to keep: sign it ad hoc with them first (push; the
          # Keychain group the extensions share), extensions first, then
          # the app.
          app="$RUNNER_TEMP/Harlo.xcarchive/Products/Applications/Harlo.app"
          for ext in HarloNotifications HarloWidgets; do
            sed "s/\$(AppIdentifierPrefix)/$APPLE_TEAM_ID./g" "ios/Harlo/$ext/$ext.entitlements" > "$RUNNER_TEMP/$ext.entitlements"
            codesign --force --sign - --entitlements "$RUNNER_TEMP/$ext.entitlements" "$app/PlugIns/$ext.appex"
          done
          sed "s/\$(AppIdentifierPrefix)/$APPLE_TEAM_ID./g" ios/Harlo/Harlo/Harlo.entitlements > "$RUNNER_TEMP/app.entitlements"
          codesign --force --sign - --entitlements "$RUNNER_TEMP/app.entitlements" "$app"
          sed "s/TEAM_ID/$APPLE_TEAM_ID/" ios/Harlo/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Harlo.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/export.log" | grep -E "error|\*\* EXPORT" || true
          if ! grep -q "EXPORT SUCCEEDED" "$RUNNER_TEMP/export.log"; then
            grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          fi
          ls -la "$RUNNER_TEMP/export"
          # What the signed app may do (push, the Keychain group), as notices.
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          for b in "$RUNNER_TEMP/ipa/Payload/Harlo.app" "$RUNNER_TEMP"/ipa/Payload/Harlo.app/PlugIns/*.appex; do
            ents=$(codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -convert json -o - - 2>/dev/null || echo "?")
            echo "::notice::$(basename "$b"): $ents"
          done

      - name: Upload to TestFlight
        run: |
          # altool finds the key as private_keys/AuthKey_<id>.p8 here.
          mkdir -p ~/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" ~/private_keys/
          ipa=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$ipa" --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID" --output-format json \
            > "$RUNNER_TEMP/upload.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/upload.log"
          rm -rf ~/private_keys
          if [ $status -ne 0 ]; then
            python3 - "$RUNNER_TEMP/upload.log" <<'PY'
          import json, sys
          text = open(sys.argv[1]).read()
          try:
              d = json.loads(text[text.index("{"):])
              for e in d.get("product-errors", []) or [d]:
                  print("::error::" + " ".join(str(e.get(k, "")) for k in ("message", "userInfo")).replace("\n", " ")[:1500])
          except Exception:
              for line in text.splitlines()[-15:]: print("::error::" + line)
          PY
            exit 1
          fi
          echo "::notice::Build ${{ github.run_number }} uploaded to App Store Connect (TestFlight shows it after processing)."

      - name: Logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: logs
          path: |
            ${{ runner.temp }}/*.log
          if-no-files-found: ignore

      - name: Forget the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

  screenshots:
    if: github.event_name == 'workflow_dispatch' && inputs.screenshots
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Xcode (the newest installed)
        run: |
          newest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$newest"

      - name: Simulator
        env:
          STORE: ${{ inputs.store }}
        run: |
          # An iPhone on the newest iOS runtime: a Pro if there is one, a Pro
          # Max for the App Store's screenshots (6.9-inch, 1320 x 2868).
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, os, re, sys
          d = json.load(sys.stdin)["devices"]
          store = os.environ.get("STORE") == "true"
          rts = sorted((k for k in d if "iOS" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k.split("iOS")[-1])])
          for rt in reversed(rts):
              phones = [x for x in d[rt] if x["name"].startswith("iPhone")]
              pick = [x for x in phones if "Pro" in x["name"] and ("Max" in x["name"]) == store] or phones
              if pick:
                  print(pick[0]["udid"]); print(pick[0]["name"], rt, file=sys.stderr); break
          ')
          [ -n "$udid" ] || { echo "::error::No iPhone simulator"; xcrun simctl list devices available; exit 1; }
          echo "UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid" || true
          # The status bar as Apple's own screenshots show it.
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100 || true

      - name: Build for the simulator
        run: |
          set -o pipefail
          brew install xcodegen
          (cd ios/Harlo && xcodegen generate)
          xcodebuild build -project ios/Harlo/Harlo.xcodeproj -scheme Harlo -configuration Debug \
            -destination "id=$UDID" -derivedDataPath "$RUNNER_TEMP/dd" -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/sim.log" | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "BUILD SUCCEEDED" "$RUNNER_TEMP/sim.log"; then
            grep -E "error:" "$RUNNER_TEMP/sim.log" | sort -u | head -40 | sed 's/^/::error::/'
            exit 1
          fi

      - name: Take the tour
        run: |
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/Harlo.app"
          xcrun simctl launch "$UDID" com.arcticlatent.harlo -tour
          data=$(xcrun simctl get_app_container "$UDID" com.arcticlatent.harlo data)
          for _ in $(seq 120); do [ -f "$data/Documents/tour/done" ] && break; sleep 1; done
          mkdir -p "$RUNNER_TEMP/shots"
          cp "$data"/Documents/tour/*.png "$RUNNER_TEMP/shots/" 2>/dev/null || true
          ls "$RUNNER_TEMP/shots"
          [ -f "$data/Documents/tour/done" ] || { echo "::error::The tour didn't finish ($(ls "$RUNNER_TEMP/shots" | wc -l) screenshots)"; exit 1; }
          echo "::notice::$(ls "$RUNNER_TEMP/shots" | wc -l) screenshots"

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore
