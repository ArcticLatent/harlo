# Harlo's tests on every push to main and every pull request: formatting,
# clippy with warnings as errors, and every crate's tests (the app's drive
# the real Slint window on Slint's testing backend, so no display is
# needed; the server's run against a scripted model on loopback). A
# separate job checks the dependencies: known vulnerabilities and unsound
# versions (cargo-audit) and unused ones (cargo-machete).
name: tests

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", "site/**", "**.md"]
  pull_request:
    paths-ignore: ["ios/**", "site/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v6
      - name: Tools
        run: |
          sudo apt-get update
          # whisper.cpp (cmake, clang), and the window's fonts, sound and keyboard.
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev pkg-config \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev
      # Pinned so a new clippy's lints arrive with a deliberate update, not
      # with an unrelated push.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Tests
        run: |
          # A scratch home: nothing a test does can reach the runner's own.
          export CARGO_HOME="$HOME/.cargo" RUSTUP_HOME="$HOME/.rustup" HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/config" XDG_DATA_HOME="$HOME/data" XDG_STATE_HOME="$HOME/state" XDG_CACHE_HOME="$HOME/cache"
          export HARLO_RELAY=http://127.0.0.1:9 HARLO_UPDATE_MANIFEST_URL=http://127.0.0.1:9 HARLO_UPDATE_CHANGELOG_URL=http://127.0.0.1:9
          cargo test --locked --workspace

  dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-machete
      # Unmaintained crates (all without a maintained replacement yet) are
      # listed but don't fail the job.
      - name: cargo audit
        run: cargo audit --deny unsound --deny yanked
      - name: cargo machete
        run: cargo machete
