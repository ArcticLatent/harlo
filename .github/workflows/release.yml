# Harlo for Linux: the AppImage and the .deb, .rpm and Arch packages, built
# on Ubuntu 22.04 (glibc 2.35: Ubuntu 22.04+, Debian 12+, Fedora,
# openSUSE, Arch…), each installed on a clean system with its server and
# window started there, then published as a GitHub Release with the signed
# update manifest Harlo reads (linux-release.json) and the notes from
# CHANGELOG.md.
#
# A release: packaging/release.sh (it tags v<version> and pushes; see
# docs/releasing.md).
# A test (the packages as the run's artifact, nothing published): push a
# branch named release-check…, or `gh workflow run release.yml`.
name: release

on:
  push:
    tags: ["v*"]
    branches: ["release-check*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NFPM_VERSION: "2.43.0"

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6

      - name: Tools
        run: |
          sudo apt-get update
          # Building (whisper.cpp: cmake, clang; the window: fonts, sound,
          # the keyboard) and the bundle's tools.
          sudo apt-get install -y --no-install-recommends build-essential cmake clang libclang-dev pkg-config \
            librsvg2-bin file desktop-file-utils libfuse2 \
            libasound2-dev libfontconfig1-dev libfreetype6-dev libxkbcommon-dev
          curl -fsSL -o nfpm.deb "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_amd64.deb"
          sudo dpkg -i nfpm.deb

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Bundle (the AppImage, the packages' tree)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/linux/bundle.sh

      - name: Packages (.deb, .rpm, Arch)
        run: |
          export VERSION=$(cat dist/version)
          for p in deb rpm archlinux; do nfpm package -f packaging/linux/nfpm.yaml -p $p -t dist/; done
          cd dist
          ls -la *.AppImage *.deb *.rpm *.pkg.tar.zst
          sha256sum *.AppImage *.deb *.rpm *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS

      - name: Runs (from the packages' tree and the AppImage)
        run: |
          dist/opt/harlo/bin/harlo --version
          dist/opt/harlo/bin/harlo-server --version
          ./dist/harlo-*.AppImage --appimage-extract-and-run --version
          # This runner's validator is older than SingleMainWindow (Desktop
          # Entry 1.5) and calls it an error, so it checks the rest.
          grep -v '^SingleMainWindow=' packaging/harlo.desktop >"$RUNNER_TEMP/harlo.desktop"
          desktop-file-validate "$RUNNER_TEMP/harlo.desktop"

      - uses: actions/upload-artifact@v6
        with:
          name: harlo-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
            dist/SHA256SUMS

  # Each package installed with its system's own package manager on a clean
  # image, then started (packaging/linux/check-start.sh): its dependencies
  # resolve, its server starts, its window opens on Xvfb and stays open.
  install:
    needs: linux
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: "ubuntu:22.04", install: "apt-get update && apt-get install -y xvfb ./harlo_*_amd64.deb" }
          - { image: "ubuntu:24.04", install: "apt-get update && apt-get install -y xvfb ./harlo_*_amd64.deb" }
          - { image: "debian:12", install: "apt-get update && apt-get install -y xvfb ./harlo_*_amd64.deb" }
          - { image: "fedora:42", install: "dnf install -y xorg-x11-server-Xvfb ./harlo-*.x86_64.rpm" }
          - { image: "opensuse/tumbleweed", install: "zypper --non-interactive install --allow-unsigned-rpm xorg-x11-server-Xvfb ./harlo-*.x86_64.rpm" }
          - { image: "archlinux:latest", install: "pacman -Syu --noconfirm && pacman -S --noconfirm xorg-server-xvfb && pacman -U --noconfirm ./harlo-*-x86_64.pkg.tar.zst" }
          # The AppImage, with only the libraries a desktop has.
          - image: "ubuntu:24.04"
            install: >-
              apt-get update && apt-get install -y xvfb libfontconfig1 libasound2t64 libxkbcommon-x11-0
              libx11-xcb1 libxcursor1 libxrandr2 libxi6 libwayland-client0 libwayland-cursor0 libwayland-egl1 libegl1 libgl1
            appimage: true
    container: ${{ matrix.image }}
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # (For the start check; without git in the image, checkout downloads.)
      - uses: actions/checkout@v6
        with:
          path: src
      - uses: actions/download-artifact@v6
        with:
          name: harlo-linux
      - name: Install
        run: ${{ matrix.install }}
      - name: Starts
        run: |
          if [ "${{ matrix.appimage }}" = true ]; then
            chmod +x ./harlo-*-x86_64.AppImage
            sh src/packaging/linux/check-start.sh "$(ls "$PWD"/harlo-*-x86_64.AppImage)"
          else
            sh src/packaging/linux/check-start.sh
          fi

  publish:
    needs: [linux, install]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          name: harlo-linux
          path: dist

      - name: Check the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [[ "$version" != "$cargo_version" ]]; then
            echo "The tag $GITHUB_REF_NAME doesn't match Cargo.toml ($cargo_version)" >&2
            exit 1
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"

      - name: Release notes
        run: |
          # (How to install is in the README.)
          packaging/changelog.sh notes "$VERSION" >"$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"

      - uses: dtolnay/rust-toolchain@stable

      # The manifest Harlo reads to update itself, signed; checked against
      # the public key built into Harlo, so a wrong key stops here.
      - name: Sign the update manifest
        env:
          HARLO_UPDATE_SIGNING_KEY: ${{ secrets.HARLO_UPDATE_SIGNING_KEY }}
        run: packaging/release-manifests.sh dist "$VERSION" "$GITHUB_REPOSITORY"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Harlo $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag
