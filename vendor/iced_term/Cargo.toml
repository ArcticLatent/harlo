# Vendored from https://github.com/Harzu/iced_term at commit
# d7c8187bd426d19a2c0d1abe615332c2c8fffab0 (after 0.8.0, with the fix for the
# UI deadlock under heavy output), MIT. Harlo's changes are listed in VENDORED.md.
[package]
name = "iced_term"
version = "0.8.0"
edition = "2021"
description = "Terminal emulator widget powered by ICED framework and alacritty terminal backend."
authors = ["Ilya Shvyryalkin <ilyashvy@gmail.com>"]
license = "MIT"
publish = false

[dependencies]
alacritty_terminal = "0.25.1"
iced = { workspace = true, features = ["canvas", "lazy", "advanced"] }
tokio = { workspace = true, features = ["sync"] }
iced_graphics = { version = "0.14.0", default-features = false }
iced_core = "0.14.0"
open = { workspace = true }
anyhow = { workspace = true, features = ["std"] }

[lints.clippy]
# Upstream's view tests build content with Default and then set one field.
field_reassign_with_default = "allow"

[dev-dependencies]
tokio = { workspace = true, features = ["sync"] }
